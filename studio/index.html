<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineIA Studio · El libro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Caladea:ital,wght@0,400;0,700;1,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0A0B22}
a{color:#1F3A5F;text-decoration-color:#8B6914}a:hover{color:#142640}
button{font:inherit;cursor:pointer}
@keyframes girar{from{transform:perspective(2400px) rotateY(-80deg);opacity:0}to{transform:perspective(2400px) rotateY(0deg);opacity:1}}
.libro{transition:transform .5s ease}button:hover .libro{transform:rotateY(-4deg) rotateX(0deg) translateY(-6px)!important}
@keyframes trote{0%,100%{translate:0 0}50%{translate:0 -1.2%}}@keyframes galope{0%,100%{translate:0 0}50%{translate:0 -2%}}.trote{animation:trote .52s ease-in-out infinite}.galope{animation:galope .38s ease-in-out infinite}@keyframes cuadros8{to{background-position-x:114.2857%}}.cuadros8{animation:cuadros8 .56s steps(8) infinite}@keyframes melies8{0%{background-position-x:0%}13.793%{background-position-x:88.8889%}48.276%{background-position-x:33.3333%}52.874%{background-position-x:44.4444%}56.322%{background-position-x:55.5556%}58.621%{background-position-x:66.6667%}60.920%{background-position-x:100%}65.517%,100%{background-position-x:77.7778%}}.melies8{animation:melies8 3.625s step-end infinite}@keyframes melies5{0%{background-position-x:0%}34.483%{background-position-x:25%}43.678%{background-position-x:50%}47.126%{background-position-x:75%}50.575%,100%{background-position-x:100%}}.melies5{animation:melies5 3.625s step-end infinite}@keyframes cuadros14{to{background-position-x:107.6923%}}.cuadros14{animation:cuadros14 4.2s steps(14) infinite}@media (prefers-reduced-motion: reduce){.trote,.galope,.cuadros8,.cuadros14,.melies8,.melies5{animation:none}.melies8{background-position-x:77.7778%}.melies5{background-position-x:100%}}
.pagina{animation:girar 0.9s cubic-bezier(.2,.7,.2,1) both;transform-origin:left center}
@media (prefers-reduced-motion: reduce){.pagina{animation:none}}
</style>
</head>
<body>
<div id="libro"></div>
<template id="plantilla">
<div style="width: 100%; min-height: 1000px; background: #0A0B22; overflow: hidden">

<sc-if value="{{esTapa}}" hint-placeholder-val="{{true}}">
<div class="pagina" style="min-height: 1000px; background: #0A0B22; color: #F3EBDD; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 56px; border-bottom: 1px solid #23264A">
<a href="../" aria-label="Volver a la página de inicio" style="display: block"><img src="../assets/img/logo.jpg" alt="CineIA Studio" style="height: 52px; width: auto; display: block; mix-blend-mode: screen"></a>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #ABA6C8">EDINBA · 2026</span>
</header>
<div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 24px; padding: 40px 56px 64px">
<div style="flex: 1 1 520px; min-width: 0">
<p style="margin: 0 0 28px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #E9A23B">TALLER DE CREACIÓN AUDIOVISUAL CON IA</p>
<h1 style="margin: 0; font-family: Cambria, Caladea, Georgia, serif; font-weight: 400; font-size: 84px; line-height: 86px; letter-spacing: -0.015em; color: #F3EBDD">Del impulso narrativo a una obra audiovisual <span style="color: #E9A23B; font-style: italic">trazable.</span></h1>

</div>
<figure style="flex: 1 1 560px; min-width: 0; margin: 0">
<div role="button" tabindex="0" aria-label="Abrir el libro" onClick="{{abrir}}" onMouseMove="{{mover}}" onMouseLeave="{{salir}}" style="position: relative; aspect-ratio: 16 / 10; cursor: pointer; overflow: hidden; border-radius: 4px; border: 1px solid #2E3560; box-shadow: 0 30px 70px rgba(0,0,0,0.6); ">
<img src="../assets/img/e1.jpg" alt="" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.35) brightness(1.05) sepia(0.15)">
<img src="../assets/img/e1.jpg" alt="El nido de las ardillas al amanecer: al pasar el cursor, el boceto en grafito se llena de color" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; -webkit-mask-image: var(--mascara); mask-image: var(--mascara)">
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 18px; background: linear-gradient(0deg, rgba(10,11,34,0.85), rgba(10,11,34,0)); display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
<span style="font-family: Cambria, Caladea, Georgia, serif; font-style: italic; font-size: 18px; color: #E7DFCF">intención / forma / huella</span>

</div>
</div>
</figure>
</div>
</div>
</sc-if>



<sc-if value="{{esCapGen}}" hint-placeholder-val="{{false}}">
<div class="pagina" style="min-height: 1000px; background: #0F1430; color: #F3EBDD; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 56px; border-bottom: 1px solid #262C52">
<button type="button" onClick="{{aTapa}}" style="min-height: 44px; padding: 0 4px; background: transparent; border: 0; color: #ABA6C8; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em">←  Tapa</button>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #ABA6C8">{{cap.contador}}</span>
</header>
<div style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 36px 40px 44px">
<button type="button" onClick="{{entrar}}" onMouseMove="{{mover}}" onMouseLeave="{{salir}}" aria-label="{{cap.aria}}" style="position: relative; display: block; width: min(100%, 1240px); aspect-ratio: 1600 / 898; padding: 0; border: 0; background: #F3EDE0; overflow: hidden; cursor: pointer; box-shadow: 0 34px 80px rgba(0,0,0,0.6)">
<img src="{{cap.imagen}}" alt="{{cap.alt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block">
<canvas data-portada3d data-img="{{cap.imagen}}" data-mapa="{{cap.mapa}}" data-anim="{{cap.anim}}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 0.4s ease"></canvas>
<div aria-hidden="true" style="position: absolute; inset: 0; transform: scale(1.035); transform-origin: 50% 38.1%; clip-path: inset(0 0 25.23% 0); pointer-events: none"><sc-for list="{{cap.capas}}" as="c" hint-placeholder-count="0"><div class="{{c.clase}}" style="position: absolute; left: {{c.x}}%; top: {{c.y}}%; width: {{c.w}}%; height: {{c.h}}%; background-image: url('{{c.src}}'); background-size: {{c.bs}}% 100%; background-repeat: no-repeat; animation-duration: {{c.dur}}s; animation-delay: {{c.delay}}s; transform: translate(calc(var(--p3x, 0) * {{c.px}}%), calc(var(--p3y, 0) * {{c.py}}%))"></div></sc-for></div>
<sc-if value="{{cap.video}}" hint-placeholder-val="{{false}}"><video data-ciclo="si" src="{{cap.video}}" poster="{{cap.imagen}}" muted playsinline autoplay preload="auto" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; transition: opacity 0.6s ease; pointer-events: none"></video><img src="{{cap.banda}}" alt="" aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 100%; height: {{cap.bandaAlto}}%; display: block; pointer-events: none"></sc-if>
</button>
</div>
</div>
</sc-if>

<sc-if value="{{esInterior}}" hint-placeholder-val="{{false}}">
<div class="pagina" style="min-height: 1000px; background: #26282C; font-family: Inter, system-ui, sans-serif; font-size: 15px; color: #1D1C1A; display: flex; flex-direction: column">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 10px 20px; color: #ECE7DC">
<button type="button" onClick="{{aCapitulo}}" style="min-height: 44px; background: transparent; color: #ECE7DC; border: 1px solid #6A6D75; border-radius: 6px; padding: 0 14px">←  Portada del capítulo</button>
<img src="../assets/img/logo.jpg" alt="CineIA Studio" style="height: 34px; width: auto; display: block; mix-blend-mode: screen">
<span style="color: #ABA597">·</span>
<span style="font-family: Cambria, Caladea, Georgia, serif; font-size: 17px; color: #F3EEE3">El bosque cambia</span>
<div style="flex: 1 1 40px"></div>
<button type="button" style="min-height: 44px; background: transparent; color: #D6B160; border: 1px solid #D6B160; border-radius: 6px; padding: 0 14px; font-weight: 600">Hablar</button>
<button type="button" style="min-height: 44px; background: transparent; color: #ECE7DC; border: 1px solid #6A6D75; border-radius: 6px; padding: 0 14px">Leer en voz alta</button>
<button type="button" style="min-height: 44px; background: transparent; color: #ECE7DC; border: 1px solid #6A6D75; border-radius: 6px; padding: 0 14px">ES · EN</button>
</header>

<div style="display: flex; flex-wrap: wrap; flex: 1 1 auto">
<aside style="flex: 0 0 216px; background: #55575D; display: flex; flex-direction: column; padding: 14px 0" aria-label="Pasos del capítulo">
<sc-for list="{{fase.pasos}}" as="p" hint-placeholder-count="9">
<sc-if value="{{p.active}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{p.ir}}" aria-current="page" style="width: 100%; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #F5EFE0; color: #1F3A5F; border: 0; text-align: left; font: inherit; cursor: pointer">
<span style="font-family: Cambria, Caladea, Georgia, serif; font-size: 18px; min-width: 26px; color: #6B5210">{{p.n}}</span>
<span style="display: flex; flex-direction: column"><span style="font-weight: 600">{{p.name}}</span><span style="font-size: 12px; color: #5E5A52">{{p.state}}</span></span>
</button>
</sc-if>
<sc-if value="{{p.idle}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{p.ir}}" style="width: 100%; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: transparent; color: #F2EEE6; border: 0; border-bottom: 1px solid #64666C; text-align: left; font: inherit; cursor: pointer">
<span style="font-family: Cambria, Caladea, Georgia, serif; font-size: 18px; min-width: 26px; color: #E6D3A3">{{p.n}}</span>
<span style="display: flex; flex-direction: column"><span>{{p.name}}</span><span style="font-size: 12px; color: #DAD5CC">{{p.state}}</span></span>
</button>
</sc-if>
</sc-for>
</aside>

<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<nav style="display: flex; flex-wrap: wrap; gap: 4px; padding: 0 20px; align-items: flex-end" aria-label="Capítulos">
<sc-for list="{{pestanas}}" as="t" hint-placeholder-count="5">
<sc-if value="{{t.active}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{t.ir}}" style="background: #F5EFE0; color: #1F3A5F; border: 0; border-radius: 14px 14px 0 0; padding: 13px 28px 11px; font-size: 14px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase">{{t.label}}</button>
</sc-if>
<sc-if value="{{t.idle}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{t.ir}}" style="background: #3E372C; color: #F3EBDD; border: 0; border-radius: 14px 14px 0 0; padding: 10px 22px 9px; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase">{{t.label}}</button>
</sc-if>
</sc-for>
</nav>

<sc-if value="{{enPortada}}" hint-placeholder-val="{{true}}">
<main style="flex: 1 1 auto; background: #F5EFE0; padding: 26px 48px 30px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px">
<h1 style="margin: 0; font-family: Cambria, Caladea, Georgia, serif; font-weight: 400; font-variant: small-caps; font-size: 40px; color: #1F3A5F">{{fase.titulo}}</h1>
<span style="font-family: Cambria, Caladea, Georgia, serif; font-style: italic; font-size: 19px; color: #3A3732">{{fase.lema}}</span>
</div>
<div style="width: 72px; height: 2px; background: #8B6914"></div>
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<figure style="flex: 999 1 520px; min-width: 0; margin: 0; aspect-ratio: 16 / 9; position: relative; border-radius: 6px; overflow: hidden; box-shadow: 0 14px 32px rgba(60,45,20,0.18)">
<img src="{{fase.poster}}" alt="{{fase.posterAlt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
<button type="button" aria-label="Reproducir la videolección" style="position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: 84px; height: 84px; border-radius: 50%; border: 2px solid #F5EFE0; background: rgba(29,28,26,0.72); display: flex; align-items: center; justify-content: center">
<svg width="26" height="28" viewBox="0 0 22 24" aria-hidden="true"><path d="M5 2 L21 12 L5 22 Z" fill="#F5EFE0"></path></svg>
</button>
<figcaption style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px; background: rgba(29,28,26,0.78); color: #ECE7DC; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 15px">
<span>{{fase.videoTitulo}}</span><span style="color: #ABA597; font-size: 13px">[POR GRABAR]</span>
</figcaption>
</figure>
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: Cambria, Caladea, Georgia, serif; font-variant: small-caps; font-size: 18px; letter-spacing: 0.04em; color: #6B5210">{{fase.galeriaTitulo}}</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{fase.galeria}}" as="g" hint-placeholder-count="4">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 5px">
<img src="{{g.src}}" alt="{{g.alt}}" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; border-radius: 3px; box-shadow: 0 6px 16px rgba(60,45,20,0.16)">
<figcaption style="font-size: 12px; line-height: 16px; color: #5E5A52">{{g.pie}}</figcaption>
</figure>
</sc-for>
</div>
</div>
</div>
</main>
</sc-if>
<sc-if value="{{enPaso}}" hint-placeholder-val="{{false}}">
<main style="flex: 1 1 auto; background: #F5EFE0; padding: 26px 48px 30px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px">
<span style="font-family: Cambria, Caladea, Georgia, serif; font-size: 40px; color: #8B6914">{{paso.n}}</span>
<h1 style="margin: 0; font-family: Cambria, Caladea, Georgia, serif; font-weight: 400; font-variant: small-caps; font-size: 40px; color: #1F3A5F">{{paso.name}}</h1>
<span style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6B5210; border: 1px solid #C9B27A; border-radius: 999px; padding: 4px 12px">{{paso.state}}</span>
</div>
<div style="width: 72px; height: 2px; background: #8B6914"></div>
<p style="margin: 0; max-width: 760px; font-family: Cambria, Caladea, Georgia, serif; font-style: italic; font-size: 18px; line-height: 27px; color: #3A3732">{{paso.intro}}</p>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
<sc-for list="{{paso.bloques}}" as="b" hint-placeholder-count="3">

<sc-if value="{{b.esTexto}}" hint-placeholder-val="{{true}}">
<section style="flex: 1 1 {{b.base}}; min-width: 0; box-sizing: border-box; background: #FBF7EC; border: 1px solid #E3D9C2; border-radius: 6px; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px">
<span style="font-family: Cambria, Caladea, Georgia, serif; font-variant: small-caps; font-size: 18px; color: #6B5210">{{b.etiqueta}}</span>
<sc-for list="{{b.parrafos}}" as="t"><p style="margin: 0; line-height: 24px">{{t}}</p></sc-for>
</section>
</sc-if>

<sc-if value="{{b.esCampos}}" hint-placeholder-val="{{false}}">
<section style="flex: 1 1 {{b.base}}; min-width: 0; box-sizing: border-box; background: #FBF7EC; border: 1px solid #E3D9C2; border-radius: 6px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
<span style="font-family: Cambria, Caladea, Georgia, serif; font-variant: small-caps; font-size: 18px; color: #6B5210">{{b.etiqueta}}</span>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 12px 18px">
<sc-for list="{{b.items}}" as="it"><div style="display: flex; flex-direction: column; gap: 3px; border-left: 2px solid #C9B27A; padding-left: 10px"><span style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #1F3A5F">{{it.k}}</span><sc-if value="{{it.hay}}"><span style="font-size: 14px; line-height: 21px">{{it.v}}</span></sc-if><sc-if value="{{it.falta}}"><span style="font-size: 13px; font-style: italic; color: #8A8273">por producir</span></sc-if></div></sc-for>
</div>
<sc-if value="{{b.hayNota}}"><span style="font-size: 13px; line-height: 20px; color: #5E5A52">{{b.nota}}</span></sc-if>
</section>
</sc-if>

<sc-if value="{{b.esOpciones}}" hint-placeholder-val="{{false}}">
<section style="flex: 1 1 {{b.base}}; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: Cambria, Caladea, Georgia, serif; font-variant: small-caps; font-size: 18px; color: #6B5210">{{b.etiqueta}}</span>
<sc-if value="{{b.hayNota}}"><span style="font-size: 13px; color: #5E5A52">{{b.nota}}</span></sc-if>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 12px">
<sc-for list="{{b.items}}" as="o">
<sc-if value="{{o.elegida}}"><div style="background: #1F3A5F; color: #F6F1E6; border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #E6D3A3">{{o.t}} · elegida</span><span style="font-size: 14px; line-height: 21px">{{o.v}}</span></div></sc-if>
<sc-if value="{{o.otra}}"><div style="background: #FBF7EC; border: 1px dashed #C9B27A; border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B5210">{{o.t}}</span><span style="font-size: 14px; line-height: 21px; color: #3A3732">{{o.v}}</span></div></sc-if>
</sc-for>
</div>
</section>
</sc-if>

<sc-if value="{{b.esLista}}" hint-placeholder-val="{{false}}">
<section style="flex: 1 1 {{b.base}}; min-width: 0; box-sizing: border-box; background: #FBF7EC; border: 1px solid #E3D9C2; border-radius: 6px; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: Cambria, Caladea, Georgia, serif; font-variant: small-caps; font-size: 18px; color: #6B5210">{{b.etiqueta}}</span>
<sc-for list="{{b.items}}" as="it"><div style="display: flex; gap: 14px; align-items: baseline; border-top: 1px solid #ECE3CF; padding-top: 8px"><span style="font-family: Cambria, Caladea, Georgia, serif; font-size: 20px; color: #8B6914; min-width: 18px">{{it.n}}</span><span style="flex: 0 0 120px; font-weight: 600; color: #1F3A5F">{{it.t}}</span><span style="flex: 1 1 260px; line-height: 22px">{{it.v}}</span></div></sc-for>
</section>
</sc-if>

<sc-if value="{{b.esLetra}}" hint-placeholder-val="{{false}}">
<section style="flex: 1 1 {{b.base}}; min-width: 0; box-sizing: border-box; background: #FBF7EC; border: 1px solid #E3D9C2; border-radius: 6px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
<span style="font-family: Cambria, Caladea, Georgia, serif; font-variant: small-caps; font-size: 18px; color: #6B5210">{{b.etiqueta}}</span>
<sc-for list="{{b.estrofas}}" as="e"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #1F3A5F">{{e.e}}</span><sc-for list="{{e.versos}}" as="v"><span style="font-family: Cambria, Caladea, Georgia, serif; font-size: 16px; line-height: 23px">{{v}}</span></sc-for></div></sc-for>
<span style="font-size: 13px; color: #5E5A52">Fragmento. La letra completa se abre aquí mismo.</span>
</section>
</sc-if>

<sc-if value="{{b.esGaleria}}" hint-placeholder-val="{{false}}">
<section style="flex: 1 1 {{b.base}}; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: Cambria, Caladea, Georgia, serif; font-variant: small-caps; font-size: 18px; color: #6B5210">{{b.etiqueta}}</span>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr)); gap: 12px">
<sc-for list="{{b.items}}" as="g"><figure style="margin: 0; display: flex; flex-direction: column; gap: 5px"><img src="{{g.src}}" alt="{{g.alt}}" loading="lazy" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; border-radius: 3px; box-shadow: 0 6px 16px rgba(60,45,20,0.16)"><figcaption style="font-size: 12px; line-height: 16px; color: #5E5A52">{{g.pie}}</figcaption></figure></sc-for>
</div>
</section>
</sc-if>

<sc-if value="{{b.esTabla}}" hint-placeholder-val="{{false}}">
<section style="flex: 1 1 {{b.base}}; min-width: 0; box-sizing: border-box; background: #FBF7EC; border: 1px solid #E3D9C2; border-radius: 6px; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; overflow-x: auto">
<span style="font-family: Cambria, Caladea, Georgia, serif; font-variant: small-caps; font-size: 18px; color: #6B5210">{{b.etiqueta}}</span>
